# CARQ — add to existing Nginx (shared server mode)
# Copy: sudo cp deploy/nginx/carq.autos.conf /etc/nginx/sites-available/carq.autos
# Enable: sudo ln -sf /etc/nginx/sites-available/carq.autos /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d carq.autos -d www.carq.autos -d api.carq.autos
# Reload: sudo nginx -t && sudo systemctl reload nginx
#
# Requires docker-compose.shared.yml (frontend :3000, backend :8000 on localhost)

upstream carq_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream carq_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Frontend
server {
    listen 80;
    server_name carq.autos www.carq.autos;

    location / {
        proxy_pass http://carq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# API + WebSocket
server {
    listen 80;
    server_name api.carq.autos;

    location / {
        proxy_pass http://carq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
