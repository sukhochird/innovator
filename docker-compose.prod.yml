services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-carq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./carq_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             if [ \"$$SEED_DEMO\" = \"true\" ]; then python manage.py seed_demo; fi &&
             python manage.py run_jt808_server --port 8080 &
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    expose:
      - "8000"
      - "8080"
    ports:
      - "${JT808_HOST_PORT:-8080}:8080"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api.carq.autos,carq.autos}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://carq.autos}
      JWT_ACCESS_LIFETIME: ${JWT_ACCESS_LIFETIME:-60}
      JWT_REFRESH_LIFETIME: ${JWT_REFRESH_LIFETIME:-1440}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./carq_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.carq.autos}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.carq.autos}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://carq.autos}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@carq.autos}
    depends_on:
      - frontend
      - backend

  jt808-simulator:
    profiles: ["demo"]
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    command: python simulator.py
    volumes:
      - ./simulator.py:/app/simulator.py:ro
    environment:
      SERVER_HOST: backend
      SERVER_PORT: "8080"
      INTERVAL: ${SIMULATOR_INTERVAL:-3}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
